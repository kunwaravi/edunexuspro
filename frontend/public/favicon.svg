<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EduNexus Pro">
  <title>EduNexus Pro</title>
  <!-- Geometric "E" mark: brand-blue letterform with the orange accent as the
       middle bar. Transparent background, no text, legible down to 16x16. -->
  <defs>
    <linearGradient id="en-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <g fill="url(#en-blue)">
    <rect x="74" y="74" width="61" height="364" rx="15"/>
    <rect x="74" y="74" width="364" height="61" rx="15"/>
    <rect x="74" y="377" width="364" height="61" rx="15"/>
  </g>
  <rect x="74" y="226" width="287" height="61" rx="15" fill="#F59E0B"/>
</svg>
